name: Kill feed author-line acceptance
on:
  pull_request:
    paths:
      - client/game/killFeedText.mjs
      - client/game/killFeedText.test.mjs
      - server/tests/contextual-killfeed.test.mjs
      - .github/workflows/killfeed-author-lines.yml
permissions:
  contents: read
jobs:
  verify-author-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify new lines and server death-event evidence
        run: node --test client/game/killFeedText.test.mjs server/tests/contextual-killfeed.test.mjs
      - name: Verify browser module graph
        run: npm run check:browser-imports
