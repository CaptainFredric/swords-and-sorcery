name: Prepare itch HTML5 candidate

on:
  push:
    branches: [main]
    paths: &release_paths
      - 'client/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/itch-*.yml'
  pull_request:
    paths: *release_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify repository
        run: npm run verify
      - name: Export the exact checked out revision
        run: npm run export:html5
      - name: Verify pinned Butler without credentials or upload
        run: |
          node scripts/release/install-butler.mjs
          node scripts/release/dry-run.mjs dist/html5
      - name: Test the exported client at a nested path
        env:
          CHROME_BIN: google-chrome
        run: node scripts/release/browser-check.mjs dist/html5
      - name: Seal verified candidate
        run: node scripts/release/candidate.mjs seal dist/html5
      - name: Preserve verified ZIP and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: itch-html5-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/html5/swords-and-sorcery-html5.zip
            dist/html5/export-report.json
            dist/html5/candidate.json
            dist/html5/browser-check.json
            dist/html5/butler-dry-run.json
            dist/html5/candidate-*.png
          if-no-files-found: error
          retention-days: 90
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: itch-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/html5/*.json
            dist/html5/*.png
          if-no-files-found: ignore
          retention-days: 7
