name: Spellblade assets

on:
  pull_request:
    paths:
      - '.github/workflows/spellblade-assets.yml'
      - 'tools/blender/**'
      - 'scripts/validate-spellblade-glb.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Blender asset worker mode
        required: true
        default: preview
        type: choice
        options:
          - bootstrap
          - preview
          - review

permissions:
  contents: read

jobs:
  spellblade-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLENDER_VERSION: '4.5.14'
      BLENDER_ARCHIVE: 'blender-4.5.14-linux-x64.tar.xz'
      BLENDER_URL: 'https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz'
      BLENDER_SHA_URL: 'https://download.blender.org/release/Blender4.5/blender-4.5.14.sha256'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install headless render runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Cache Blender archive
        uses: actions/cache@v4
        with:
          path: .cache/blender-4.5.14-linux-x64.tar.xz
          key: blender-4.5.14-linux-x64

      - name: Download verified Blender LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache .blender
          if [[ ! -s ".cache/${BLENDER_ARCHIVE}" ]]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              "${BLENDER_URL}" \
              --output ".cache/${BLENDER_ARCHIVE}"
          fi
          curl --fail --location --retry 4 --retry-delay 3 \
            "${BLENDER_SHA_URL}" \
            --output .cache/blender.sha256
          grep " ${BLENDER_ARCHIVE}$" .cache/blender.sha256 | (cd .cache && sha256sum -c -)
          tar -xJf ".cache/${BLENDER_ARCHIVE}" --strip-components=1 -C .blender
          ./.blender/blender --version

      - name: Build Spellblade asset evidence
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'preview' }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          MODE="${REQUESTED_MODE}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then MODE=preview; fi
          ./.blender/blender \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender/characters/spellblade/build.py \
            -- \
            --mode "${MODE}" \
            --out artifacts/spellblade-assets \
            --source-revision "${SOURCE_REVISION}"

      - name: Validate external GLB parser and rig rules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-spellblade-glb.py --self-test
          python3 scripts/validate-spellblade-glb.py --self-test-rig
          python3 scripts/validate-spellblade-glb.py --self-test-animation
          python3 scripts/validate-spellblade-glb.py --self-test-first-person
          if [[ -s artifacts/spellblade-assets/spellblade.glb ]]; then
            python3 scripts/validate-spellblade-glb.py artifacts/spellblade-assets/spellblade.glb
            test -s artifacts/spellblade-assets/spellblade-fp.glb
            python3 scripts/validate-spellblade-glb.py --first-person artifacts/spellblade-assets/spellblade-fp.glb
          fi

      - name: Validate worker report
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/spellblade-assets/spellblade-build-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/spellblade-assets/spellblade-build-report.json').read_text())
          assert report['workerReady'] is True
          assert report['visualStage'] in {'worker-bootstrap', 'third-person-animated'}
          assert len(report['sourceRevision']) == 40
          if report['visualStage'] == 'third-person-animated':
              assert report['rig']['runtimeAxes'] == {'up': '+Y', 'forward': '-Z'}
              assert report['rig']['authoringAxes'] == {'up': '+Z', 'forward': '+Y'}
              assert report['model']['heightMeters'] >= 1.85
              assert report['model']['groundZ'] >= -0.02
              assert report['model']['triangles'] <= report['model']['triangleBudget']
              assert report['outputs']['thirdPersonGlb'] == 'spellblade.glb'
              assert report['sizes']['thirdPersonGlbBytes'] <= report['sizes']['thirdPersonTargetBytes']
              required = {
                  'Idle', 'Run', 'Air', 'Guard', 'Slash_1', 'Slash_2', 'Slash_3',
                  'Cast', 'Dash', 'Stagger', 'Death',
              }
              assert set(report['animations']) == required
          print('SPELLBLADE_WORKER_REPORT_OK', report['visualStage'], report['sourceRevision'])
          PY

      - name: Upload Spellblade worker evidence
        uses: actions/upload-artifact@v4
        with:
          name: spellblade-asset-worker-evidence
          path: artifacts/spellblade-assets/
          if-no-files-found: error
          retention-days: 7
