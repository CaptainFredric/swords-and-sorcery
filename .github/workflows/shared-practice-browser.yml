name: Shared Practice two-client Chrome acceptance
on:
  pull_request:
    paths:
      - 'server/src/server.mjs'
      - 'shared/sim/RoomManager.mjs'
      - 'shared/sim/Room.mjs'
      - 'shared/sim/wire.mjs'
      - 'client/network/GameLink.mjs'
      - 'client/network/GameSocket.mjs'
      - 'client/menu/MenuController.mjs'
      - 'client/main.mjs'
      - 'client/index.html'
      - 'scripts/shared-practice-browser.mjs'
      - '.github/workflows/shared-practice-browser.yml'
permissions:
  contents: read
jobs:
  two-chrome-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start authoritative game server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3001 HOST=127.0.0.1 node server/src/server.mjs > /tmp/shared-practice.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/shared-practice.log
          exit 1
      - name: Locate Chromium
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Verify real remote sessions, guest movement and combat while host operates machinery
        env:
          SHARED_PRACTICE_URL: http://127.0.0.1:3001
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/shared-practice-browser.mjs
      - name: Upload two-client screenshots and authoritative state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-practice-two-chrome
          path: output/playwright/shared-practice/
          retention-days: 7
