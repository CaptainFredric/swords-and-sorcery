name: Open Rooms and Solo dual-banner browser acceptance
on:
  push:
    paths:
      - 'client/index.html'
      - 'client/main.mjs'
      - 'client/menu.css'
      - 'client/mobile.css'
      - 'client/menu/**'
      - 'client/network/**'
      - 'shared/sim/Room.mjs'
      - 'shared/sim/RoomManager.mjs'
      - 'server/src/server.mjs'
      - 'scripts/room-menu-browser.mjs'
      - '.github/workflows/room-menu-browser.yml'
  pull_request:
    paths:
      - 'client/index.html'
      - 'client/main.mjs'
      - 'client/menu.css'
      - 'client/mobile.css'
      - 'client/menu/**'
      - 'client/network/**'
      - 'shared/sim/Room.mjs'
      - 'shared/sim/RoomManager.mjs'
      - 'server/src/server.mjs'
      - 'scripts/room-menu-browser.mjs'
      - '.github/workflows/room-menu-browser.yml'
permissions:
  contents: read
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start authoritative game server
        shell: bash
        run: |
          PORT=3001 HOST=127.0.0.1 node --experimental-websocket server/src/server.mjs > /tmp/room-menu-server.log 2>&1 &
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then exit 0; fi
            sleep .2
          done
          cat /tmp/room-menu-server.log
          exit 1
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Verify two-banner menus and capture real desktop/mobile screenshots
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          SIEGE_BROWSER_URL: http://127.0.0.1:3001
        run: node --experimental-websocket scripts/room-menu-browser.mjs
      - name: Save screenshots and browser measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castleward-room-menus
          path: output/playwright/room-menus/
          retention-days: 7
