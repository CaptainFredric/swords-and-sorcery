name: Verify public Render build

on:
  push:
    branches:
      - test/public-arena-capture
    paths:
      - '.github/workflows/public-render-check.yml'
      - 'scripts/capture-public-arena.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_URL: https://swords-and-sorcery.onrender.com

jobs:
  verify-public-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wake service and wait for current revision
        shell: bash
        run: |
          set -euo pipefail
          rm -f health.json game.html live-weapon-pose.mjs live-castleward.mjs live-playability.css
          for attempt in $(seq 1 24); do
            healthy=false
            current=false
            if curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/health" -o health.json; then
              healthy=true
              curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/" -o game.html || true
              curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/client/game/weaponPose.mjs" -o live-weapon-pose.mjs || true
              curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/shared/worlds/castleward.mjs" -o live-castleward.mjs || true
              curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/client/playability.css" -o live-playability.css || true
              if grep -qi 'BOT DUEL' game.html \
                && grep -qi 'PRACTICE YARD' game.html \
                && grep -qi 'CASTLEWARD' game.html \
                && grep -qi 'Find a public match' game.html \
                && grep -qi 'ESC FOR PRACTICE TOOLS' game.html \
                && grep -Eq 'FIRST_PERSON_WEAPON_SCALE\s*=\s*0\.74' live-weapon-pose.mjs \
                && grep -qi 'castleward' live-castleward.mjs \
                && grep -q 'hud.pointer-locked .practice-tools' live-playability.css; then
                current=true
              fi
            fi
            if [ "$healthy" = true ] && [ "$current" = true ]; then
              echo "Render is healthy and serving the current Castleward/solo/first-person revision"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Render did not serve the current main revision in time." >&2
              echo "health=$healthy current=$current" >&2
              echo "This distinguishes a stale/failed deploy from a browser test failure." >&2
              exit 1
            fi
            sleep 10
          done

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (health.ok !== true || !Number.isInteger(health.rooms)) {
            throw new Error(`Unexpected health response: ${JSON.stringify(health)}`);
          }
          console.log('Health OK:', health);
          NODE

          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/client/main.mjs" -o /dev/null
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/client/styles.css" -o /dev/null

      - name: Verify public WebSocket handshake
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.PUBLIC_URL;
          const wsUrl = base.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:') + '/ws';
          const ws = new WebSocket(wsUrl);
          let gotHello = false;
          let gotPong = false;
          const timer = setTimeout(() => {
            console.error('Timed out waiting for WebSocket hello/pong');
            ws.close();
            process.exit(1);
          }, 15000);
          ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'ping', sentAt: 12345 })));
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(String(event.data));
            if (message.type === 'hello') gotHello = true;
            if (message.type === 'pong' && message.sentAt === 12345) gotPong = true;
            if (gotHello && gotPong) {
              clearTimeout(timer);
              console.log('Public WSS hello + pong OK');
              ws.close();
            }
          });
          ws.addEventListener('error', () => {
            clearTimeout(timer);
            process.exit(1);
          });
          ws.addEventListener('close', () => {
            if (!(gotHello && gotPong)) process.exit(1);
          });
          NODE

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Drive current public modes and capture browser evidence
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/capture-public-arena.mjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-render-structural-evidence
          path: |
            public-game-menu.png
            public-game-practice.png
            public-game-practice-dummy.png
            public-game-bot-duel.png
            public-game-ffa-waiting.png
            public-game-browser-report.json
            health.json
            game.html
            live-weapon-pose.mjs
            live-castleward.mjs
            live-playability.css
          retention-days: 7
