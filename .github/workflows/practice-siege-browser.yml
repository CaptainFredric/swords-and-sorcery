name: Practice hostile siege Chrome acceptance
on:
  pull_request:
    paths:
      - 'shared/sim/practiceSiegeOperators.mjs'
      - 'shared/sim/practiceSiege.mjs'
      - 'shared/sim/practice.mjs'
      - 'shared/sim/wire.mjs'
      - 'shared/sim/siegeSkills.mjs'
      - 'shared/sim/BotController.mjs'
      - 'client/main.mjs'
      - 'client/index.html'
      - 'scripts/practice-siege-browser.mjs'
      - '.github/workflows/practice-siege-browser.yml'
permissions:
  contents: read
jobs:
  chrome-siege:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start local game
        shell: bash
        run: |
          set -euo pipefail
          PORT=3001 HOST=127.0.0.1 node server/src/server.mjs > /tmp/siege-game.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/siege-game.log
          exit 1
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Exercise Practice controls and actual siege AI in Chrome
        env:
          SIEGE_BROWSER_URL: http://127.0.0.1:3001
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/practice-siege-browser.mjs
      - name: Upload screenshots, state and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-hostile-siege-browser
          path: output/playwright/practice-hostile-siege/
          retention-days: 7
