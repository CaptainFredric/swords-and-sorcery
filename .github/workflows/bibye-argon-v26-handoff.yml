name: Bi-Bye-llista original Argon v26 binary handoff
on:
  push:
    branches:
      - feat/bibye-sharp-turn-look-around-argon-20261114
    paths:
      - 'assets/staging/bibye-v26/manifest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bibye-v26-once
  cancel-in-progress: false
jobs:
  stage-originals:
    if: github.repository == 'CaptainFredric/swords-and-sorcery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Reconstruct temporary transport chunks and verify BOTH originals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          root=pathlib.Path('assets/staging/bibye-v26')
          manifest=json.loads((root/'manifest.json').read_text())
          for name,entry in manifest['files'].items():
              pieces=[]
              for i in range(entry['parts']):
                  p=root/'chunks'/f'{name}-{i:03d}.b64'
                  pieces.append(''.join(p.read_text().split()))
              binary=base64.b64decode(''.join(pieces),validate=True)
              digest=hashlib.sha256(binary).hexdigest()
              assert len(binary)==entry['expected_bytes'],(name,len(binary))
              assert digest==entry['sha256'],(name,digest)
              p=pathlib.Path('/tmp')/entry['source_name']
              p.write_bytes(binary)
              print('EXACT_ARGON_ORIGINAL',name,len(binary),digest)
          PY
          node scripts/stage-bibye-argon-v26.mjs \
            /tmp/Bi_Bye_llista_GameReady_PBR.glb \
            /tmp/Bi_Bye_llista_blend_archive.zip
          sha256sum client/assets/props/bibye-ballista/Bi_Bye_llista_GameReady_PBR.glb
          sha256sum assets/source/bibye-ballista/Bi_Bye_llista_blend_archive.zip
      - name: Focused authoritative sweep, HUD, Armory and mobile control regressions
        run: |
          node --experimental-websocket --test \
            server/tests/bi-bye-sweep.test.mjs \
            client/ui/biByeHudView.test.mjs \
            server/tests/siege-armory.test.mjs
          node --experimental-websocket --test --test-name-pattern='Bi-Bye' client/game/touchLayout.test.mjs
          npm run check:browser-imports
      - name: Commit byte-exact ORIGINAL GLB and Blender source to draft branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/bibye-sharp-turn-look-around-argon-20261114"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- client/assets/props/bibye-ballista/Bi_Bye_llista_GameReady_PBR.glb \
                    assets/source/bibye-ballista/Bi_Bye_llista_blend_archive.zip
          git rm -r -- assets/staging/bibye-v26
          git commit -m 'assets(bibye): commit byte-exact original Argon 26-clip GLB and Blender source'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Start isolated test server for real Chrome original-v26 inspection
        shell: bash
        run: |
          set -euo pipefail
          PORT=3001 HOST=127.0.0.1 node server/src/server.mjs > /tmp/bibye-v26-game.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/bibye-v26-game.log
          exit 1
      - name: Find real Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Inspect actual authored animations, mounted third attack and Skill, real Fire
        env:
          SIEGE_BROWSER_URL: http://127.0.0.1:3001
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/bi-bye-sweep-browser.mjs
      - name: Preserve original-v26 Chrome screenshots and full acceptance JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibye-argon-v26-actual-chrome-inspection
          path: output/playwright/bi-bye-sharp-turn/
          retention-days: 7
