name: High Grounds HTML5 Chrome acceptance
on:
  pull_request:
    paths:
      - 'shared/worlds/highGrounds.mjs'
      - 'shared/sim/highGroundsMode.mjs'
      - 'shared/sim/highGroundsFoundry.mjs'
      - 'client/worlds/HighGroundsRenderer.mjs'
      - 'client/main.mjs'
      - 'client/index.html'
      - 'scripts/high-grounds-browser.mjs'
      - '.github/workflows/high-grounds-browser.yml'
permissions:
  contents: read
jobs:
  chrome-high-grounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start server for real web client
        shell: bash
        run: |
          PORT=3001 HOST=127.0.0.1 node server/src/server.mjs >/tmp/high-grounds-game.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/high-grounds-game.log
          exit 1
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Verify High Grounds menu, live local match, 3D renderer and capture HUD
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          SIEGE_BROWSER_URL: http://127.0.0.1:3001
        run: node scripts/high-grounds-browser.mjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-grounds-browser
          path: output/playwright/high-grounds/
          retention-days: 7
